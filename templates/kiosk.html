<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Token Management System</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,"Segoe UI",sans-serif;
    background:#eef6fb;
    color:#12314d;
}

body{
    display:flex;
    flex-direction:column;
}

.header{
    width:100%;
    height:90px;
    background:#0b4f7c;
    display:flex;
    align-items:center;
    padding:0 5vw;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.logo{
    height:48px;
    width:auto;
    margin-right:30px;
}

.header-title{
    font-size:24px;
    font-weight:600;
    letter-spacing:1.5px;
}

.menu-container{
    margin-left:auto;
    position:relative;
}

.menu-btn{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
}

.menu-btn:hover{
    background:rgba(255,255,255,.15);
    border-radius:8px;
}

.material-symbols-outlined{
    font-size:34px;
}

.menu{
    display:none;
    position:absolute;
    top:55px;
    right:0;
    width:230px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    z-index:999;
}

.menu a{
    display:block;
    padding:15px 20px;
    text-decoration:none;
    color:#12314d;
    font-weight:600;
}

.menu a:hover{
    background:#eef6fb;
}

.main-content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.token-card{
    background:white;
    width:min(700px,95vw);
    border-radius:14px;
    border-top:7px solid #1683c4;
    padding:45px;
    text-align:center;
    box-shadow:0 5px 20px rgba(12,68,105,.08);
}

.token-label{
    color:#607080;
    font-size:18px;
    letter-spacing:3px;
    font-weight:600;
}

.generated-token{
    margin:25px 0;
    font-size:170px;
    font-weight:700;
    color:#0b4f7c;
    line-height:1;
}

.token-message{
    color:#607080;
    font-size:18px;
}

.footer{
    margin-top:auto;
    background:#0b4f7c;
    color:white;
    text-align:center;
    padding:18px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="header">

    <!-- Vercel serves the logo -->
    <img src="/logo.png" class="logo">

    <div class="header-title">
        TOKEN DISPENSER
    </div>

    <div class="menu-container">

        <button class="menu-btn" onclick="toggleMenu(event)">

            <span class="material-symbols-outlined">
                apps
            </span>

        </button>

        <div class="menu" id="menu">

            <a href="/">
                Main Display
            </a>

            <a href="/operator.html">
                Calling Unit
            </a>

            <a href="/kiosk.html">
                Token Dispenser
            </a>

        </div>

    </div>

</div>


<div class="main-content">

    <div class="token-card">

        <div class="token-label">
            YOUR TOKEN NUMBER
        </div>

        <div id="token" class="generated-token">
            000
        </div>

        <div class="token-message">
            Please wait for your token to be called.
        </div>

    </div>

</div>


<div class="footer">
    © GTM4Health 2026
</div>


<!-- Socket.IO client -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>

/* ==========================================
   RENDER BACKEND
========================================== */

const API_URL =
    "https://token-management-system-cvo8.onrender.com";


/* ==========================================
   MENU
========================================== */

function toggleMenu(event){

    event.stopPropagation();

    const menu =
        document.getElementById("menu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";
}


window.addEventListener("click", function(){

    document.getElementById("menu").style.display =
        "none";

});


/* ==========================================
   CONNECT TO RENDER SOCKET.IO
========================================== */

const socket = io(API_URL);


/* ==========================================
   SOCKET CONNECTION
========================================== */

socket.on("connect", function(){

    console.log(
        "Connected to Render:",
        socket.id
    );

});


socket.on("connect_error", function(error){

    console.error(
        "Socket.IO connection error:",
        error
    );

});


socket.on("disconnect", function(){

    console.log(
        "Disconnected from Render"
    );

});


/* ==========================================
   NEW TOKEN
========================================== */

socket.on("new_token", function(data){

    if(!data || !data.token){
        return;
    }

    const token =
        data.token;

    /*
        Update displayed token
    */

    document.getElementById("token").innerHTML =
        token;


    /*
        Open printable token page
        on Vercel
    */

    window.open(
        "/print.html?token=" +
        encodeURIComponent(token),
        "_blank",
        "width=420,height=700"
    );

});


/* ==========================================
   QUEUE RESET
========================================== */

socket.on("queue_reset", function(){

    document.getElementById("token").innerHTML =
        "000";

});


</script>

</body>

</html>
