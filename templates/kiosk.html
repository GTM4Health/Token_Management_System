<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Management System</title>

    <style>

        body{

    margin:0;

    padding-top:90px;

    background:#f2f2f2;

    display:flex;

    justify-content:center;

    align-items:center;

    height:calc(100vh - 90px);

    font-family:Arial, Helvetica, sans-serif;

}
.topbar{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:90px;

    background:#0b4f7c;

    display:flex;

    align-items:center;

    padding:0 5vw;

    box-shadow:0 2px 8px rgba(0,0,0,.15);

    z-index:1000;

}

.logo{

    height:48px;
    width:auto;
    margin-right:30px;

}
        .token-content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.token-card{
    width:min(650px,92vw);
    background:white;
    border-radius:14px;
    padding:60px 40px;
    text-align:center;
    border-top:7px solid #1683c4;
    box-shadow:0 8px 30px rgba(12,68,105,.10);
}

.token-label{
    color:#607080;
    font-size:17px;
    letter-spacing:3px;
}

.generated-token{
    margin:20px 0;
    color:#0b4f7c;
    font-size:150px;
    font-weight:700;
    line-height:1;
}

.token-message{
    color:#607080;
    font-size:17px;
}
.header-title{

    color:white;

    font-size:24px;

    font-weight:600;

    letter-spacing:1.5px;

}

    </style>
</head>

<body>

<div class="topbar">

    <div class="topbar">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <div class="header-title">
        TOKEN GENERATION
    </div>

</div>
</div>

<div class="token-content">

    <div class="token-card">

        <div class="token-label">
            YOUR TOKEN NUMBER
        </div>

        <div
            id="token"
            class="generated-token"
        >
            {{ token }}
        </div>

        <div class="token-message">
            Please wait for your token to be called
        </div>

    </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const socket = io();

socket.on("connect", function(){

    console.log("Connected");

});

socket.on("new_token", function(data){

    document.getElementById("token").innerHTML = data.token;

    window.open(
        "/print/" + data.token,
        "_blank",
        "width=420,height=700"
    );

});
socket.on("queue_reset", function(){

    document.getElementById("token").innerHTML = "000";

});
</script>

</body>
</html>
