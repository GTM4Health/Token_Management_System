<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Display</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Segoe UI",sans-serif;
    background:#eef6fb;
    color:#12314d;
}

.page{
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

.header{
    width:100%;
    height:90px;
    background:#0b4f7c;
    display:flex;
    align-items:center;
    padding:0 5vw;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.logo{
    height:48px;
    width:auto;
    margin-right:30px;
}

.header-title{
    font-size:24px;
    font-weight:600;
    letter-spacing:1.5px;
}

.display-content{
    flex:1;
    display:grid;
    grid-template-columns:1.5fr .7fr;
    gap:28px;
    padding:35px 5vw;
}

.current-section{
    background:white;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:45px;
    border-top:7px solid #1683c4;
    box-shadow:0 5px 25px rgba(12,68,105,.08);
}

.display-label{
    color:#607080;
    font-size:18px;
    letter-spacing:4px;
    font-weight:600;
}

.display-token{
    font-size:180px;
    font-weight:700;
    color:#0b4f7c;
    margin-top:15px;
}

.proceed{
    margin-top:30px;
    color:#31556e;
    font-size:28px;
    text-align:center;
}

.queue-section{
    background:#0b4f7c;
    color:white;
    border-radius:14px;
    padding:35px;
}

.queue-title{
    font-size:18px;
    letter-spacing:3px;
    font-weight:600;
    padding-bottom:20px;
    border-bottom:1px solid rgba(255,255,255,.25);
}

.queue-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.queue-token{
    background:rgba(255,255,255,.12);
    padding:16px 20px;
    border-radius:8px;
    font-size:30px;
    font-weight:600;
}

.queue-empty{
    margin-top:20px;
    opacity:.6;
}

.footer{
    width:100%;
    background:#0b4f7c;
    color:white;
    text-align:center;
    padding:18px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="page">

    <div class="header">

        <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

        <div class="header-title">
            HOSPITAL DISPLAY
        </div>

    </div>

    <div class="display-content">

        <div class="current-section">

            <div class="display-label">
                TOKEN NO.
            </div>

            <div id="serving" class="display-token">
                ---
            </div>

            <div class="proceed">
                Please proceed to the Doctor Room
            </div>

        </div>

        <div class="queue-section">

            <div class="queue-title">
                WAITING QUEUE
            </div>

            <div id="queue" class="queue-list">

            </div>

        </div>

    </div>

    <div class="footer">
        © GTM4Health 2026
    </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const socket = io();

socket.on("serving_changed", function(data){

    document.getElementById("serving").innerHTML = data.token;

    loadWaiting();

    speakToken(data.token);

});

socket.on("queue_reset", function(){

    document.getElementById("serving").innerHTML="---";

    loadWaiting();

});

function formatToken(token){

    let letter=token.charAt(0);

    let digits=token.substring(1).split("");

    let words=digits.map(function(d){

        switch(d){

            case "0":return "Zero";
            case "1":return "One";
            case "2":return "Two";
            case "3":return "Three";
            case "4":return "Four";
            case "5":return "Five";
            case "6":return "Six";
            case "7":return "Seven";
            case "8":return "Eight";
            case "9":return "Nine";

        }

    });

    return letter+", "+words.join(", ");

}

function speakToken(token){

    window.speechSynthesis.cancel();

    let speech=new SpeechSynthesisUtterance(

        "Attention please. Token number "+
        formatToken(token)+
        ". Please proceed to the Doctor Room."

    );

    speech.rate=.8;

    speech.pitch=1;

    window.speechSynthesis.speak(speech);

}

function loadWaiting(){

    fetch("/waiting")

    .then(response=>response.json())

    .then(data=>{

        if(data.length==0){

            document.getElementById("queue").innerHTML=
            '<div class="queue-empty">No tokens in queue</div>';

        }

        else{

            let html="";

            data.forEach(function(token){

                html+='<div class="queue-token">'+token+'</div>';

            });

            document.getElementById("queue").innerHTML=html;

        }

    });

}

loadWaiting();

</script>

</body>
</html>
