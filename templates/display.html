<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Display</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,"Segoe UI",sans-serif;
    background:#eef6fb;
    color:#12314d;
}

.page{
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    width:100%;
    height:90px;
    background:#0b4f7c;
    display:flex;
    align-items:center;
    padding:0 5vw;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    position:relative;
}

.logo{
    height:56px;
    width:auto;
    margin-right:30px;
    object-fit:contain;
}

.demo-logo{
    height:64px;
    width:auto;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

.header-title{
    font-size:24px;
    font-weight:600;
    letter-spacing:1.5px;
}

.menu-container{
    margin-left:auto;
    position:relative;
}

.menu-btn{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
}

.menu-btn:hover{
    background:rgba(255,255,255,.15);
    border-radius:8px;
}

.material-symbols-outlined{
    font-size:34px;
}

.menu{
    display:none;
    position:absolute;
    right:0;
    top:55px;
    width:230px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    z-index:1000;
}

.menu a{
    display:block;
    padding:15px 20px;
    color:#12314d;
    text-decoration:none;
    font-weight:600;
}

.menu a:hover{
    background:#eef6fb;
}

.display-content{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1.5fr .7fr;
    gap:28px;
    padding:35px 5vw;
    align-items:stretch;
    overflow:hidden;
}

.current-section{
    background:white;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:45px;
    border:5px solid #0b4f7c;
    box-shadow:0 5px 25px rgba(12,68,105,.08);
}

.display-label{
    color:#607080;
    font-size:18px;
    letter-spacing:4px;
    font-weight:600;
}

.display-token{
    font-size:180px;
    font-weight:700;
    color:#0b4f7c;
    margin-top:15px;
}

.proceed{
    margin-top:30px;
    color:#31556e;
    font-size:28px;
    text-align:center;
}

.queue-section{
    background:#0b4f7c;
    color:white;
    border-radius:14px;
    padding:35px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 90px - 52px - 70px);
    overflow:hidden;
}

.queue-title{
    font-size:18px;
    letter-spacing:3px;
    font-weight:600;
    padding-bottom:20px;
    border-bottom:1px solid rgba(255,255,255,.25);
    flex-shrink:0;
}

.queue-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.35) transparent;
}

.queue-list::-webkit-scrollbar{
    width:6px;
}

.queue-list::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.35);
    border-radius:3px;
}

.queue-token{
    background:rgba(255,255,255,.12);
    padding:16px 20px;
    border-radius:8px;
    font-size:30px;
    font-weight:600;
    flex-shrink:0;
}

.queue-empty{
    margin-top:20px;
    opacity:.6;
}

.queue-count{
    font-size:13px;
    letter-spacing:2px;
    opacity:.75;
    margin-top:10px;
    flex-shrink:0;
}

.footer{
    width:100%;
    height:52px;
    background:#0b4f7c;
    color:white;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    flex-shrink:0;
}

/* ---------- Reset Toast ---------- */

.toast{
    display:none;
    position:fixed;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    background:#0b4f7c;
    color:white;
    padding:16px 32px;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
    box-shadow:0 6px 24px rgba(0,0,0,.25);
    z-index:9999;
    white-space:nowrap;
    animation:fadeInOut 3s ease forwards;
}

@keyframes fadeInOut{
    0%  { opacity:0; transform:translateX(-50%) translateY(-10px); }
    15% { opacity:1; transform:translateX(-50%) translateY(0); }
    70% { opacity:1; }
    100%{ opacity:0; }
}

@media(max-width:768px){
    .header-title{ font-size:16px; letter-spacing:.5px; }
    .logo{ height:36px; margin-right:15px; }
    .demo-logo{ height:44px; }
    .display-content{
        grid-template-columns:1fr;
        padding:20px 4vw;
        gap:16px;
    }
    .current-section{ padding:30px 20px; }
    .display-token{ font-size:110px; }
    .proceed{ font-size:20px; }
    .queue-section{
        max-height:280px;
        padding:20px;
    }
    .queue-token{ font-size:22px; padding:12px 16px; }
}

@media(max-width:480px){
    .header{ height:70px; padding:0 4vw; }
    .logo{ height:28px; margin-right:10px; }
    .demo-logo{ height:36px; }
    .header-title{ display:none; }
    .display-token{ font-size:80px; }
    .proceed{ font-size:16px; }
    .current-section{ padding:20px 15px; }
}

</style>

</head>

<body>

<div class="page">

    <div class="header">

        <img src="/static/logo.jpeg" class="logo">

        <img src="/static/demologo.jpeg" class="demo-logo">

        <div class="header-title">
            MAIN DISPLAY
        </div>

        <div class="menu-container">

            <button class="menu-btn" onclick="toggleMenu(event)">

                <span class="material-symbols-outlined">
                    apps
                </span>

            </button>

            <div id="menu" class="menu">

                <a href="/">Main Display</a>

                <a href="/operator">Calling Unit</a>

                <a href="/kiosk">Token Dispenser</a>

            </div>

        </div>

    </div>

    <div class="display-content">

        <div class="current-section">

            <div class="display-label">
                TOKEN NO.
            </div>

            <div id="serving" class="display-token">
                ---
            </div>

            <div class="proceed">
                Please proceed to the room
            </div>

        </div>

        <div class="queue-section">

            <div class="queue-title">
                WAITING QUEUE
            </div>

            <div id="queue-count" class="queue-count">
                0 WAITING
            </div>

            <div id="queue" class="queue-list"></div>

        </div>

    </div>

    <div class="footer">
        © GTM4Health 2026
    </div>

</div>

<div id="toast" class="toast">All Tokens have been Reset</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==========================================
   RENDER BACKEND
========================================== */

const API_URL =
    "https://token-management-system-cvo8.onrender.com";


/* ==========================================
   MENU
========================================== */

function toggleMenu(event){

    event.stopPropagation();

    const menu = document.getElementById("menu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";
}


window.addEventListener("click", function(){

    document.getElementById("menu").style.display = "none";

});


/* ==========================================
   SOCKET.IO CONNECTION
========================================== */

const socket = io(API_URL);


/* ==========================================
   SOCKET CONNECTION STATUS
========================================== */

socket.on("connect", function(){

    console.log("Connected to Render:", socket.id);

});


socket.on("connect_error", function(error){

    console.error("Socket.IO connection error:", error);

});


socket.on("disconnect", function(){

    console.log("Disconnected from Render");

});


/* ==========================================
   CURRENT SERVING TOKEN
   Runs when page first opens
========================================== */

function loadCurrent(){

    fetch(`${API_URL}/current`)

        .then(response => {

            if(!response.ok){

                throw new Error(
                    "Current token request failed"
                );

            }

            return response.json();

        })

        .then(data => {

            document.getElementById("serving").innerHTML =
                data.token || "---";

        })

        .catch(error => {

            console.error(
                "Current token error:",
                error
            );

            document.getElementById("serving").innerHTML =
                "---";

        });

}


/* ==========================================
   LIVE TOKEN CHANGE
========================================== */

socket.on("serving_changed", function(data){

    if(data && data.token){

        document.getElementById("serving").innerHTML =
            data.token;

        loadWaiting();

        speakToken(data.token);

    }

});


/* ==========================================
   QUEUE RESET
========================================== */

socket.on("queue_reset", function(){

    document.getElementById("serving").innerHTML =
        "---";

    document.getElementById("queue-count").innerHTML =
        "0 WAITING";

    loadWaiting();

    showToast();

});


/* ==========================================
   FORMAT TOKEN FOR SPEECH
========================================== */

function formatToken(token){

    let digits = token.split("");

    let words = digits.map(function(d){

        switch(d){

            case "0": return "Zero";
            case "1": return "One";
            case "2": return "Two";
            case "3": return "Three";
            case "4": return "Four";
            case "5": return "Five";
            case "6": return "Six";
            case "7": return "Seven";
            case "8": return "Eight";
            case "9": return "Nine";

            default:
                return "";

        }

    });

    return words.join(", ");

}


/* ==========================================
   TEXT-TO-SPEECH
========================================== */

function speakToken(token){

    window.speechSynthesis.cancel();

    let speech =
        new SpeechSynthesisUtterance(

            "Token " +
            formatToken(token) +
            ". Please proceed to room."

        );

    speech.rate = 0.8;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

}


/* ==========================================
   SHOW TOAST NOTIFICATION
========================================== */

function showToast(){

    const toast = document.getElementById("toast");

    toast.style.display = "block";
    toast.style.animation = "none";

    void toast.offsetWidth; /* reflow to restart animation */

    toast.style.animation = "fadeInOut 3s ease forwards";

    setTimeout(function(){
        toast.style.display = "none";
    }, 3000);

}


/* ==========================================
   LOAD WAITING QUEUE
========================================== */

function loadWaiting(){

    fetch(`${API_URL}/waiting`)

        .then(response => {

            if(!response.ok){

                throw new Error(
                    "Waiting queue request failed"
                );

            }

            return response.json();

        })

        .then(data => {

            const queue =
                document.getElementById("queue");

            const countEl =
                document.getElementById("queue-count");

            if(!data || data.length === 0){

                countEl.innerHTML = "0 WAITING";

                queue.innerHTML =
                    '<div class="queue-empty">' +
                    'No tokens in queue' +
                    '</div>';

                return;

            }

            countEl.innerHTML =
                data.length + " WAITING";

            let html = "";

            data.forEach(function(token){

                html +=
                    '<div class="queue-token">' +
                    token +
                    '</div>';

            });

            queue.innerHTML = html;

        })

        .catch(error => {

            console.error(
                "Waiting queue error:",
                error
            );

            document.getElementById("queue").innerHTML =
                '<div class="queue-empty">' +
                'Unable to connect to server' +
                '</div>';

        });

}


/* ==========================================
   INITIAL PAGE LOAD
========================================== */

loadCurrent();

loadWaiting();


/* ==========================================
   AJAX POLLING FALLBACK (every 5 seconds)
   Keeps display in sync even if Socket.IO
   events are missed.
========================================== */

setInterval(function(){
    loadCurrent();
    loadWaiting();
}, 2000);

</script>

</body>
</html>
