<!DOCTYPE html>
<html>
<head>

<title>Print Token</title>

<style>

body {
    font-family: Arial, Helvetica, sans-serif;
    width: 300px;
    margin: auto;
    text-align: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
}

h1 {
    font-size: 60px;
    margin: 20px 0;
}

.line {
    border-top: 1px dashed black;
    margin: 15px 0;
}

.small {
    font-size: 15px;
}

@media print {
    body {
        width: 80mm;
    }
}

</style>

</head>

<body onload="printToken()">

<div class="logo">
    GTM4Health
</div>

<div class="line"></div>

<div class="small">
    TOKEN NUMBER
</div>

<h1 id="tokenNumber">
    ---
</h1>

<div class="line"></div>

<p>
    Date:<br>
    <span id="date"></span>
</p>

<p>
    Time:<br>
    <span id="time"></span>
</p>

<div class="line"></div>

<p>
    Please wait until your<br>
    token is announced.
</p>

<div class="line"></div>

<p>
    Thank You
</p>

<script>

function loadToken() {

    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (token) {
        document.getElementById("tokenNumber").textContent = token;
    }

    // Current date and time
    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString();

    document.getElementById("time").textContent =
        now.toLocaleTimeString();
}

function printToken() {

    loadToken();

    setTimeout(function() {

        window.print();

        setTimeout(function() {
            window.close();
        }, 500);

    }, 200);

}

</script>

</body>
</html>
