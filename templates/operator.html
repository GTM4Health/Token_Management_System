<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calling Unit</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
overflow:hidden;
font-family:Arial,"Segoe UI",sans-serif;
background:#eef6fb;
color:#12314d;
}

body{
display:flex;
flex-direction:column;
}

.header{

width:100%;
height:90px;

background:#0b4f7c;

display:flex;
align-items:center;

padding:0 5vw;

color:white;

box-shadow:0 2px 8px rgba(0,0,0,.12);

position:relative;

}

.logo{

height:56px;
width:auto;
margin-right:30px;
object-fit:contain;

}

.demo-logo{
height:64px;
width:auto;
position:absolute;
left:50%;
transform:translateX(-50%);
pointer-events:none;
}

.header-title{

font-size:24px;
font-weight:600;
letter-spacing:1.5px;

}

/* ---------- Apps Menu ---------- */

.menu-container{

margin-left:auto;

position:relative;

}

.menu-btn{

background:none;

border:none;

color:white;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

padding:8px;

}

.menu-btn:hover{

background:rgba(255,255,255,.15);

border-radius:8px;

}

.material-symbols-outlined{

font-size:34px;

}

.menu{

display:none;

position:absolute;

top:55px;

right:0;

width:230px;

background:white;

border-radius:10px;

overflow:hidden;

box-shadow:0 8px 25px rgba(0,0,0,.18);

z-index:9999;

}

.menu a{

display:block;

padding:15px 20px;

text-decoration:none;

font-weight:600;

color:#12314d;

}

.menu a:hover{

background:#eef6fb;

}

/* ---------- Main ---------- */

.management-content{

flex:1;
min-height:0;
overflow-y:auto;

display:flex;
flex-direction:column;
align-items:center;

padding:40px;

}

.cards{

width:100%;

display:flex;

justify-content:center;

}

.card{

background:white;

width:min(760px,92vw);

border-radius:14px;

padding:60px 50px;

border:5px solid #0b4f7c;

box-shadow:0 5px 20px rgba(12,68,105,.08);

text-align:center;

}

.card-label{

color:#607080;

font-size:18px;

letter-spacing:3px;

font-weight:600;

}

.current-number{

font-size:190px;

font-weight:700;

color:#0b4f7c;

margin-top:30px;

line-height:1;

}

.manual-call{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

margin-top:40px;

}

.manual-call input{

width:260px;

height:52px;

padding:0 16px;

font-size:18px;

border:1px solid #c6d0d8;

border-radius:8px;

outline:none;

}

.manual-call button{

height:52px;

padding:0 28px;

border:none;

border-radius:8px;

background:#0b4f7c;

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

}

.footer{

height:52px;
background:#0b4f7c;
color:white;
text-align:center;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
flex-shrink:0;

}

/* ---------- Reset Toast ---------- */

.toast{
    display:none;
    position:fixed;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    background:#388e3c;
    color:white;
    padding:16px 32px;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
    box-shadow:0 6px 24px rgba(0,0,0,.25);
    z-index:9999;
    white-space:nowrap;
    animation:fadeInOut 3s ease forwards;
}

@keyframes fadeInOut{
    0%  { opacity:0; transform:translateX(-50%) translateY(-10px); }
    15% { opacity:1; transform:translateX(-50%) translateY(0); }
    70% { opacity:1; }
    100%{ opacity:0; }
}

@media(max-width:768px){
    .header-title{ font-size:16px; letter-spacing:.5px; }
    .logo{ height:36px; margin-right:15px; }
    .demo-logo{ height:44px; }
    .management-content{ padding:20px; }
    .card{ padding:30px 20px; }
    .current-number{ font-size:120px; margin-top:15px; }
    .manual-call{ flex-direction:column; gap:10px; }
    .manual-call input{ width:100%; }
    .manual-call button{ width:100%; }
}

@media(max-width:480px){
    .header{ height:70px; padding:0 4vw; }
    .logo{ height:28px; margin-right:10px; }
    .demo-logo{ height:36px; }
    .header-title{ display:none; }
    .current-number{ font-size:90px; }
    .card-label{ font-size:14px; }
}

</style>

</head>

<body>

<div class="header">

<img src="/static/logo.jpeg" class="logo">

<img src="/static/demologo.jpeg" class="demo-logo">

<div class="header-title">

CALLING UNIT

</div>

<div class="menu-container">

<button class="menu-btn" onclick="toggleMenu(event)">

<span class="material-symbols-outlined">

apps

</span>

</button>

<div class="menu" id="menu">

<a href="/">Main Display</a>

<a href="/operator">Calling Unit</a>

<a href="/kiosk">Token Dispenser</a>

</div>

</div>

</div>


<div class="management-content">

<div class="cards">

<div class="card">

<div class="card-label">

CURRENT TOKEN

</div>

<div id="current" class="current-number">

---

</div>

</div>

</div>


<div class="manual-call">

<input
type="number"
id="manualToken"
placeholder="Enter Token Number">

<button
onclick="callSpecific()"
class="call-button">

Call Token

</button>

</div>


</div>


<div class="footer">

© GTM4Health 2026

</div>

<div id="toast" class="toast">All Tokens have been Reset</div>


<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

/* ==========================================
   RENDER BACKEND
========================================== */

const API_URL =
    "https://token-management-system-cvo8.onrender.com";


/* ==========================================
   SOCKET.IO
========================================== */

const socket = io(API_URL);


/* ==========================================
   APPS MENU
========================================== */

function toggleMenu(event){

    event.stopPropagation();

    const menu =
        document.getElementById("menu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";

}


window.addEventListener("click", function(){

    document.getElementById("menu").style.display =
        "none";

});


/* ==========================================
   SOCKET CONNECTION
========================================== */

socket.on("connect", function(){

    console.log(
        "Connected to Render:",
        socket.id
    );

});


socket.on("connect_error", function(error){

    console.error(
        "Socket.IO connection error:",
        error
    );

});


socket.on("disconnect", function(){

    console.log(
        "Disconnected from Render"
    );

});


/* ==========================================
   LOAD CURRENT TOKEN
========================================== */

function loadCurrent(){

    fetch(`${API_URL}/current`)

        .then(response => {

            if(!response.ok){

                throw new Error(
                    "Failed to load current token"
                );

            }

            return response.json();

        })

        .then(data => {

            document.getElementById("current").innerHTML =
                data.token || "---";

        })

        .catch(error => {

            console.error(
                "Current token error:",
                error
            );

            document.getElementById("current").innerHTML =
                "---";

        });

}


/* ==========================================
   CALL NEXT TOKEN
========================================== */

function nextToken(){

    fetch(`${API_URL}/next`, {

        method:"POST"

    })

    .then(response => response.json())

    .then(data => {

        console.log("Next token:", data);

    })

    .catch(error => {

        console.error(
            "Next token error:",
            error
        );

    });

}


/* ==========================================
   CALL AGAIN
========================================== */

function callAgain(){

    fetch(`${API_URL}/call_again`, {

        method:"POST"

    })

    .then(response => response.json())

    .then(data => {

        console.log("Call again:", data);

    })

    .catch(error => {

        console.error(
            "Call again error:",
            error
        );

    });

}


/* ==========================================
   CALL SPECIFIC TOKEN
========================================== */

function callSpecific(){

    let token =
        document.getElementById("manualToken").value;

    if(token === ""){

        return;

    }


    fetch(`${API_URL}/call_specific`, {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            token:token
        })

    })

    .then(response => response.json())

    .then(data => {

        console.log(
            "Specific token:",
            data
        );

    })

    .catch(error => {

        console.error(
            "Specific token error:",
            error
        );

    });


    document.getElementById("manualToken").value = "";

}


/* ==========================================
   RESET QUEUE
========================================== */

function resetQueue(){

    if(!confirm("Reset the entire queue?")){

        return;

    }


    fetch(`${API_URL}/reset`, {

        method:"POST"

    })

    .then(response => response.json())

    .then(data => {

        console.log(
            "Queue reset:",
            data
        );

        showToast();

    })

    .catch(error => {

        console.error(
            "Reset error:",
            error
        );

    });

}


/* ==========================================
   SHOW TOAST NOTIFICATION
========================================== */

function showToast(){

    const toast = document.getElementById("toast");

    toast.style.display = "block";
    toast.style.animation = "none";

    void toast.offsetWidth;

    toast.style.animation = "fadeInOut 3s ease forwards";

    setTimeout(function(){
        toast.style.display = "none";
    }, 3000);

}


/* ==========================================
   LIVE SERVING TOKEN UPDATE
========================================== */

socket.on("serving_changed", function(data){

    if(data && data.token){

        document.getElementById("current").innerHTML =
            data.token;

    }

});


/* ==========================================
   QUEUE RESET EVENT
========================================== */

socket.on("queue_reset", function(){

    document.getElementById("current").innerHTML =
        "---";

});


/* ==========================================
   INITIAL LOAD
========================================== */

loadCurrent();


/* ==========================================
   AJAX POLLING FALLBACK (every 5 seconds)
   Keeps current token in sync even if
   Socket.IO events are missed.
========================================== */

setInterval(function(){
    loadCurrent();
}, 2000);

</script>

</body>

</html>
