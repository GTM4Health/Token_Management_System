<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Room Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Segoe UI",sans-serif;
background:#eef6fb;
color:#12314d;
}

.header{
width:100%;
height:90px;
background:#0b4f7c;
display:flex;
align-items:center;
padding:0 5vw;
color:white;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.logo{
height:48px;
margin-right:30px;
}

.header-title{
font-size:24px;
font-weight:600;
letter-spacing:1.5px;
}

.management-content{
padding:40px 5vw;
}

.cards{
display:grid;
grid-template-columns:1fr;
gap:25px;
max-width:700px;
margin:auto;
}

.card{
background:white;
border-radius:12px;
padding:35px;
border-top:6px solid #1683c4;
box-shadow:0 5px 20px rgba(12,68,105,.08);
text-align:center;
}

.card-label{
color:#607080;
font-size:16px;
letter-spacing:2px;
font-weight:600;
}

.current-number{
font-size:110px;
font-weight:700;
color:#0b4f7c;
margin-top:20px;
}

.actions{
display:flex;
justify-content:center;
gap:15px;
margin-top:35px;
flex-wrap:wrap;
}

button{
padding:15px 25px;
border:none;
border-radius:8px;
font-size:17px;
font-weight:600;
cursor:pointer;
}

.call-button{
background:#0b4f7c;
color:white;
}

.reset-button{
background:#d32f2f;
color:white;
}
.again-button{

background:#0b4f7c;
color:white;

}



.footer{
margin-top:40px;
background:#0b4f7c;
color:white;
text-align:center;
padding:18px;
font-size:13px;
}

</style>

</head>

<body>

<div class="header">

<img src="{{ url_for('static', filename='logo.png') }}" class="logo">

<div class="header-title">
DOCTOR CALLING
</div>

</div>

<div class="management-content">

<div class="cards">

<div class="card">

<div class="card-label">

CURRENT TOKEN

</div>

<div id="current" class="current-number">

---

</div>

</div>

</div>
<div style="text-align:center; margin-bottom:20px;">

    <input
        type="number"
        id="manualToken"
        placeholder="Enter Token Number"
        style="padding:12px; width:220px; font-size:18px;">

    <button
        onclick="callSpecific()"
        class="call-button">

        Call Token

    </button>

</div>
<div class="actions">

<button
class="call-button"
onclick="nextToken()">

Call Next Token

</button>

<button
class="again-button"
onclick="callAgain()">

Call Again

</button>

<button
class="reset-button"
onclick="resetQueue()">

Reset Queue

</button>

</div>

</div>

<div class="footer">

© GTM4Health 2026

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const socket = io();

function nextToken(){

    fetch("/next",{
        method:"POST"
    });

}

function callAgain(){

    fetch("/call_again",{
        method:"POST"
    });

}

function callSpecific(){

    let token =
        document.getElementById("manualToken").value;

    fetch("/call_specific",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            token:token
        })

    });

    document.getElementById("manualToken").value = "";

}

function resetQueue(){

    if(confirm("Reset the entire queue?")){

        fetch("/reset",{
            method:"POST"
        });

    }

}

socket.on("serving_changed", function(data){

    document.getElementById("current").innerHTML = data.token;

});
socket.on("queue_reset", function(){

    document.getElementById("current").innerHTML = "---";

});
</script>
</body>

</html>
